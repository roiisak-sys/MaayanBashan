backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "הגדרות אתר"
    files:
      - file: "src/content/settings/settings.md"
        name: "settings"
        label: "הגדרות כלליות"
        fields:
          - {label: "כותרת האתר", name: "title", widget: "string"}
          - {label: "טאגליין", name: "tagline", widget: "string"}
          - {label: "תמונת הירו", name: "heroImage", widget: "image"}
          - {label: "ביו קצר", name: "shortBio", widget: "text"}
          - {label: "טלפון", name: "phone", widget: "string"}
          - {label: "מייל", name: "email", widget: "string"}
          - {label: "אינסטגרם", name: "instagram", widget: "string", required: false}
          - {label: "טיקטוק", name: "tiktok", widget: "string", required: false}
          - {label: "פייסבוק", name: "facebook", widget: "string", required: false}
          - {label: "יוטיוב", name: "youtube", widget: "string", required: false}
          - {label: "ספוטיפיי", name: "spotify", widget: "string", required: false}
          - {label: "וואטסאפ (קישור מלא, לדוגמה https://wa.me/972501234567)", name: "whatsapp", widget: "string", required: false}
  - name: "about"
    label: "אודות"
    files:
      - file: "src/content/about/about.md"
        name: "about"
        label: "תוכן אודות"
        fields:
          - {label: "כותרת", name: "title", widget: "string"}
          - {label: "תוכן", name: "body", widget: "markdown"}
  - name: "media"
    label: "מהמדיה"
    folder: "src/content/media"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "כותרת", name: "title", widget: "string"}
      - label: "קטגוריה"
        name: "category"
        widget: "select"
        hint: 'פודקאסט = פרקי "ניתוח גוף פתוח", טלוויזיה = אזכורים בטלוויזיה, עיתונות = כתבות ופינות בעיתונות/אתרים'
        options:
          - {label: 'פודקאסט "ניתוח גוף פתוח"', value: "podcast"}
          - {label: "טלוויזיה", value: "tv"}
          - {label: "עיתונות", value: "article"}
          - {label: "אירוח בפודקאסטים", value: "other"}
      - label: "ערוץ"
        name: "outlet"
        widget: "select"
        required: false
        hint: "רלוונטי לקטגוריית טלוויזיה - קובע את הסדר בדף: קשת 12, כאן 11, i24, ynet, ואחר כך השאר"
        options:
          - {label: "קשת 12", value: "keshet"}
          - {label: "כאן 11", value: "kan"}
          - {label: "i24NEWS", value: "i24"}
          - {label: "ynet", value: "ynet"}
          - {label: "אחר", value: "other"}
      - {label: "תאריך", name: "date", widget: "datetime"}
      - {label: "קישור חיצוני", name: "url", widget: "string"}
      - {label: "תמונה", name: "image", widget: "image", required: false, hint: "לא חובה כשהקישור הוא סרטון יוטיוב - במקרה כזה תמונה ממוזערת נמשכת אוטומטית מהסרטון"}
      - {label: "תיאור קצר", name: "description", widget: "text", required: false}
  - name: "courses"
    label: "הרצאות וקורסים"
    folder: "src/content/courses"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "כותרת", name: "title", widget: "string"}
      - {label: "תיאור", name: "body", widget: "markdown"}
      - {label: "פורמט", name: "format", widget: "string"}
      - {label: "קישור/טלפון ליצירת קשר", name: "contactLink", widget: "string"}
      - {label: "תמונה", name: "image", widget: "image", required: false}
      - {label: "מוצג בדף הבית", name: "featured", widget: "boolean", default: false}
      - {label: "תאריך התחלה", name: "startDate", widget: "datetime", required: false, time_format: false, hint: "קובע את הסדר בדף הקורסים - הקורס שמתחיל הכי קרוב מופיע ראשון"}
      - label: "מועדי מפגשים"
        name: "sessions"
        widget: "list"
        required: false
        hint: "כל התאריכים של המחזור. שם המחזור, לוח המפגשים וכל טקסט שתלוי בתאריך מתעדכנים לבד לפי מה שרשום כאן"
        field: {label: "תאריך מפגש", name: "date", widget: "datetime", time_format: false}
  - name: "organizations"
    label: "ארגונים"
    files:
      - file: "src/content/organizations/organizations.md"
        name: "organizations"
        label: "תוכן דף ארגונים"
        fields:
          - {label: "תגית עליונה", name: "tag", widget: "string"}
          - {label: "כותרת", name: "title", widget: "string"}
          - {label: "פתיח", name: "intro", widget: "text"}
          - label: "יתרונות (רשת 2x2)"
            name: "benefits"
            widget: "list"
            fields:
              - {label: "כותרת", name: "title", widget: "string"}
              - {label: "תיאור", name: "description", widget: "string"}
          - label: "קטלוג ההרצאות"
            name: "lectures"
            widget: "list"
            required: false
            hint: "כל הרצאה מופיעה ככרטיס בעמוד וגם בנתוני ה-schema של גוגל"
            fields:
              - {label: "שם ההרצאה", name: "title", widget: "string"}
              - {label: "אורך", name: "duration", widget: "string", required: false, hint: "למשל: 90 דקות"}
              - {label: "תיאור", name: "summary", widget: "text"}
              - {label: "מתאים ל", name: "forWhom", widget: "string", required: false}
              - label: "מה לוקחים מההרצאה"
                name: "takeaways"
                widget: "list"
                required: false
                field: {label: "שורה", name: "item", widget: "string"}
              - {label: "מרצה אורח", name: "guest", widget: "string", required: false}
              - {label: "להבליט ככרטיס מומלץ", name: "featured", widget: "boolean", default: false, required: false}
          - label: "איך זה עובד (שלבים)"
            name: "process"
            widget: "list"
            required: false
            fields:
              - {label: "שם השלב", name: "title", widget: "string"}
              - {label: "תיאור", name: "description", widget: "text"}
          - label: "שאלות נפוצות"
            name: "faq"
            widget: "list"
            required: false
            hint: "מופיעות בעמוד וגם נשלחות לגוגל כ-FAQ"
            fields:
              - {label: "שאלה", name: "q", widget: "string"}
              - {label: "תשובה", name: "a", widget: "text"}
          - label: "ארגונים שעבדו עם מעיין (קרוסלה)"
            name: "clients"
            widget: "list"
            required: false
            hint: "רק ארגונים שההרצאה אצלם אכן התקיימה. בקשה להצעת מחיר אינה לקוח. בלי לוגו השם מוצג כטקסט"
            fields:
              - {label: "שם הארגון", name: "name", widget: "string"}
              - {label: "לוגו", name: "logo", widget: "image", required: false}
          - label: "משובים מארגונים"
            name: "testimonials"
            widget: "list"
            required: false
            hint: "ציטוט מדויק בלבד, כפי שנכתב. לא לנסח מחדש ולא להוסיף"
            fields:
              - {label: "הציטוט", name: "quote", widget: "text"}
              - {label: "שם", name: "author", widget: "string"}
              - {label: "תפקיד", name: "role", widget: "string", required: false}
              - {label: "ארגון", name: "org", widget: "string", required: false}
              - {label: "תאריך", name: "date", widget: "string", required: false}
          - {label: "פסקת סיכום", name: "closing", widget: "text"}
          - {label: "טקסט מורחב (SEO)", name: "body", widget: "markdown", required: false, hint: "הטקסט הארוך בתחתית העמוד. כותרות בפורמט ## נקראות על ידי גוגל כשאלות"}
  - name: "testimonials"
    label: "המלצות"
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    identifier_field: author
    fields:
      - {label: "שם הממליץ/ה", name: "author", widget: "string"}
      - {label: "ציטוט", name: "quote", widget: "text"}
      - {label: "תמונה/מקור", name: "source", widget: "string", required: false}
  - name: "partner_logos"
    label: "לוגואים - כפי שהופיעה ב"
    folder: "src/content/partner_logos"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - {label: "שם הגוף", name: "name", widget: "string"}
      - {label: "לוגו", name: "logo", widget: "image"}
